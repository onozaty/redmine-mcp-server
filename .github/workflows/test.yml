name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Start Redmine
        run: |
          API_KEY=$(.github/scripts/start-redmine.sh)
          echo "::add-mask::$API_KEY"
          echo "REDMINE_TEST_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "REDMINE_TEST_API_KEY=$API_KEY" >> "$GITHUB_ENV"

      - name: Integration tests
        run: pnpm run test:integration

      - name: Show Redmine logs
        if: failure()
        run: docker logs redmine-test
